name: Bug report
description: Something in the app or widget doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Walls tab
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: Android Settings → Apps → El Salto → version at the bottom (e.g. 1.0.42, or 1.0.42-foss for a self-built one).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 7, Android 14
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Conditions
        - Walls / wetness
        - Sun and shade
        - Radar
        - Route log
        - Home-screen widget
        - Data download / offline copy
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot. For a wrong wetness or dry time, say which wall, when, and what the rock was really like.
