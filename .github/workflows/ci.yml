name: CI

# Runs the model test and builds an unofficial "El Salto FOSS" debug APK for every push and pull
# request. It uses no secrets: official releases are built and signed elsewhere by the maintainer.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:testReleaseUnitTest :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ElSalto-FOSS-debug
          path: app/build/outputs/apk/debug/*.apk
